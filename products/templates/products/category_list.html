{% extends 'base.html' %}

{% block content %}

<h1>Product Categories</h1>
<div class="row">
    {% for category in Categories %}
    <div class="col-md-4">
        <div class="card mb-3">
            <div class="card-body">
                <h2 class="card-title">{{ category.name }}</h2>
                <p class="card-text">{{ category.description }}</p>
                <p>Number of Products: {{ category.product_count }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
